version: '3.8'

services:
  agentdnai-web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://agentdnai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/agentdnai
      - TOKEN_PEPPER=${TOKEN_PEPPER:?Set TOKEN_PEPPER to a strong random secret}
      - AUTH_PEPPER=${AUTH_PEPPER:?Set AUTH_PEPPER to a different strong random secret}
      - NODE_ENV=production
      - ALLOW_DEMO_SEED=false
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - agentdnai-data:/app/db
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health').catch(()=>null); process.exit(r?.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentdnai
      POSTGRES_USER: agentdnai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdnai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agentdnai-web
    restart: unless-stopped

volumes:
  agentdnai-data:
  postgres-data:
  caddy-data:
  caddy-config:
